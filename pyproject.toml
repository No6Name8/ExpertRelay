[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expertrelay"
version = "0.1.0"
description = "Virtual memory for AI: MoE expert caching, prediction, and prefetching across RAM, SSD, and networked devices."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "mindspore==2.7.1",
    "numpy",
    "tokenizers",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    # reference implementation for tests/test_runtime_vs_hf_transformers.py
    # and bench/reference_check.py; never imported by the runtime
    "torch",
    "transformers==5.17.0",
    "huggingface_hub",
    "safetensors",
    # charts for bench/phase3_analysis.py
    "matplotlib",
]

[project.scripts]
expertrelay-profile = "expertrelay.manager.profile:main"
expertrelay-build-store = "expertrelay.store.build_store:main"
expertrelay-download-checkpoint = "expertrelay.store.download_checkpoint:main"
expertrelay-generate = "expertrelay.runtime.generate:main"
expertrelay-int8-kernels = "expertrelay.bench.int8_kernels:main"
expertrelay-phase2-baselines = "expertrelay.bench.phase2_baselines:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["models", "benchmarks/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line length is a formatter concern, not a lint failure
]

[tool.ruff.lint.isort]
known-first-party = ["expertrelay"]

[tool.ruff.format]
quote-style = "double"
